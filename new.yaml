mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.108.0

securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods

  - name: otelcol-storage
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true

  - name: otelcol-storage
    mountPath: /var/lib/otelcol

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

    file_storage:
      directory: /var/lib/otelcol

  receivers:
    filelog:
      include:
        - /var/log/pods/*/*/*.log

      exclude:
        - /var/log/pods/observability_otel-collector-*/*/*.log

      start_at: beginning

      storage: file_storage

      include_file_path: true

      operators:
        # Extract namespace and pod name from:
        # /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/'

        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]

        - type: move
          from: attributes.pod
          to: resource["k8s.pod.name"]

        - type: move
          from: attributes.container
          to: resource["k8s.conatainer.name"]

  processors:
    batch: {}

  exporters:
    debug:
      verbosity: detailed

  service:
    extensions:
      - health_check
      - file_storage

    pipelines:
      logs:
        receivers:
          - filelog
        processors:
          - batch
        exporters:
          - debug
