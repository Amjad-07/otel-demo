mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.108.0

securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods

  - name: otelcol-storage
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true

  - name: otelcol-storage
    mountPath: /var/lib/otelcol

alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

    file_storage:
      directory: /var/lib/otelcol

  receivers:
    filelog:
      include:
        - /var/log/pods/*/*/*.log

      exclude:
        - /var/log/pods/kube-system_*/*/*.log
        - /var/log/pods/observability_*/*/*.log
        - /var/log/pods/istio-system_*/*/*.log
        - /var/log/pods/linkerd_*/*/*.log

      start_at: beginning

      storage: file_storage

      include_file_path: true

      operators:
        # Extract namespace and pod name from:
        # /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
        #by default,if no parse to is mentioned ,it will be in attributes under log records
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/'

        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]

        - type: move
          from: attributes.pod
          to: resource["k8s.pod.name"]

        - type: move
          from: attributes.container
          to: resource["k8s.container.name"]

        - type: regex_parser
          parse_from: body
          regex: '^(?P<timestamp>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<partial>[PF])\s+(?P<message>.*)$'

        - type: move
          from: attributes.message
          to: body

        #by default,if no parse to is mentioned ,it will be in attributes under  Timestamp which is under log records
        - type: time_parser
          id: time-parser-k8s
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z'
          on_error: send_quiet

        - type: recombine
          combine_field: body
          combine_with: ""
          is_last_entry: 'attributes.partial == "F"'
          source_identifier: attributes["log.file.path"]

# INFO(level):     10.74.128.1:49126 - "GET /health HTTP/1.1" 200 OK
        - type: regex_parser
          parse_from: body
          regex: '^(?P<level>[A-Z]+):\s+(?P<message>.*)$'

          #10.74.128.1:49126 - "GET /health HTTP/1.1" 200 OK
        - type: move
          from: attributes.message
          to: body

        - type: severity_parser
          parse_from: attributes.level

        

          
 
  processors:
    batch: {}

  exporters:
    debug:
      verbosity: detailed

  service:
    extensions:
      - health_check
      - file_storage

    pipelines:
      logs:
        receivers:
          - filelog
        processors:
          - batch
        exporters:
          - debug
